spring.application.name=tripmate

# 카카오 키 같은 비밀값은 git 에 올리지 않는 secrets.properties(저장소 맨 위 폴더)에 둔다(없어도 뜬다). 예: KAKAO_CLIENT_ID=...
spring.config.import=optional:file:./secrets.properties

# 로컬은 메모리 H2 로 띄운다. 배포 때는 환경변수로 Postgres 주소를 넣는다
spring.datasource.url=${DB_URL:jdbc:h2:mem:tripmate}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
# H2 콘솔(/h2-console)은 DB 를 그대로 열어 보여 주므로 개발용 로그인을 켠 로컬에서만 연다
spring.h2.console.enabled=${tripmate.dev-login}

# 화면 그리는 동안 커넥션을 붙잡지 않게 끈다. 지연 로딩은 조회 메서드에서 끝낸다
spring.jpa.open-in-view=false

# 카카오 콘솔에 등록할 Redirect URI 는 {서버 주소}/login/oauth2/code/kakao (로컬은 http://localhost:8080/...)
# 키 없이도 서버가 뜨게 기본값을 unset 으로 둔다. unset 이면 화면에 카카오 버튼을 숨긴다
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:unset}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,profile_image
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# 카카오 키 없이 로컬에서 예시 방 참여자로 들어가 보는 개발용 로그인. 배포에서는 꼭 끈다(기본 꺼짐)
tripmate.dev-login=${DEV_LOGIN:false}

# 다른 사이트에서 보낸 요청에는 세션 쿠키가 따라가지 않게 한다. CSRF 토큰 대신 이것으로 막는다(SecurityConfig)
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# 역할 보드의 이동·회비 근거. 키가 없으면 그 상자에 안내만 나오고 나머지는 그대로 돈다
# 카카오는 로그인과 같은 REST API 키를 쓴다(콘솔에서 카카오맵·길찾기를 켜야 한다)
tripmate.kakao.rest-key=${KAKAO_REST_KEY:${KAKAO_CLIENT_ID:unset}}
tripmate.opinet.key=${OPINET_KEY:unset}
# 오피넷 키가 없을 때 쓰는 휘발유 값(원/L)과 승용차 연비(km/L). 둘 다 어림값이라 화면에 "어림값"으로 적는다
tripmate.fuel.default-price=1700
tripmate.fuel.km-per-liter=12
