spring:
  application:
    name: tripmate

  # 카카오 키 같은 비밀값은 git 에 올리지 않는 secrets.properties(저장소 맨 위 폴더)에 둔다(없어도 뜬다). 예: KAKAO_CLIENT_ID=...
  config:
    import: optional:file:./secrets.properties

  # 로컬은 메모리 H2 로 띄운다. 배포 때는 환경변수로 Postgres 주소를 넣는다
  datasource:
    url: ${DB_URL:jdbc:h2:mem:tripmate}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:create-drop}
    # 화면 그리는 동안 커넥션을 붙잡지 않게 끈다. 지연 로딩은 조회 메서드에서 끝낸다
    open-in-view: false
    # 참여자마다 되는 날·설문을 따로 읽지 않게(N+1) 지연 로딩 칸을 50개씩 묶어 한 번에 읽는다. 라이브러리 없이 Hibernate 설정 한 줄
    properties:
      hibernate:
        default_batch_fetch_size: 50

  # H2 콘솔(/h2-console)은 DB 를 그대로 열어 보여 주므로 기본은 닫는다. 로컬에서 볼 때만 H2_CONSOLE=true
  h2:
    console:
      enabled: ${H2_CONSOLE:false}

  # 카카오 콘솔에 등록할 Redirect URI 는 {서버 주소}/login/oauth2/code/kakao (로컬은 http://localhost:8080/...)
  # 키 없이도 서버가 뜨게 기본값을 unset 으로 둔다. unset 이면 화면에 카카오 버튼을 숨긴다
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:unset}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            scope: profile_nickname,profile_image
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  # 운영: css·js·그림 주소에 내용 해시를 붙이고(style-3f9a….css) 1년 캐시. 고치면 주소가 바뀌어 사용자는 새 파일을 받는다
  web:
    resources:
      chain:
        strategy:
          content:
            enabled: true
            paths: "/css/**,/js/**,/img/**"
      cache:
        cachecontrol:
          max-age: 365d

server:
  # html·json·css·js 를 gzip 으로. 휴대폰 데이터로 처음 열 때 받는 양이 준다
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json
  servlet:
    session:
      cookie:
        # 다른 사이트에서 보낸 요청에는 세션 쿠키가 따라가지 않게 한다. CSRF 토큰 대신 이것으로 막는다(SecurityConfig)
        same-site: lax
        http-only: true
        # 배포(https)에서는 COOKIE_SECURE=true 로 쿠키가 https 로만 가게 한다. 로컬 http 에서 켜면 로그인이 안 붙는다
        secure: ${COOKIE_SECURE:false}
  # Render 같은 곳은 앞단 프록시가 https 를 풀고 http 로 넘긴다. X-Forwarded-* 를 믿어야 카카오 redirect-uri({baseUrl})가 https 로 나온다
  forward-headers-strategy: ${FORWARD_HEADERS:none}

# 역할 보드의 이동·회비 근거. 키가 없으면 그 상자에 안내만 나오고 나머지는 그대로 돈다
tripmate:
  kakao:
    # 카카오는 로그인과 같은 REST API 키를 쓴다(콘솔에서 카카오맵·길찾기를 켜야 한다)
    rest-key: ${KAKAO_REST_KEY:${KAKAO_CLIENT_ID:unset}}
  opinet:
    key: ${OPINET_KEY:unset}
  # 오피넷 키가 없을 때 쓰는 휘발유 값(원/L)과 승용차 연비(km/L). 둘 다 어림값이라 화면에 "어림값"으로 적는다
  fuel:
    default-price: 1700
    km-per-liter: 12
