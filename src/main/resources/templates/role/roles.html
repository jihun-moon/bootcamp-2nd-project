<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('역할 보드')}"></head>
<body th:data-trip-id="${tripId}">
<div class="page">
  <header th:replace="~{fragments/common :: tripHeader}"></header>
  <main class="stack">
    <div class="between wrap">
      <p class="muted small">카드를 누르면 역할을 바꿀 수 있어요. PC 에서는 끌어서 옮겨도 돼요.</p>
      <div class="row wrap">
        <button type="button" id="btn-copy" class="btn">카톡용 글 복사</button>
        <a th:href="@{/trips/{id}/receipt(id=${tripId})}" class="btn">영수증 뽑기</a>
        <button type="button" id="btn-add-role" class="btn" hidden>역할 더하기</button>
        <!-- 추천은 모두의 배정을 갈아엎으니 방장에게만 보인다(서버도 막는다) -->
        <button type="button" id="btn-recommend" class="btn primary" hidden>설문으로 추천받기</button>
      </div>
    </div>
    <!-- 역할 칸들. roles.js 가 그린다 -->
    <div id="board" class="board"></div>

    <!-- 이동·회비 근거. 카카오를 부르니 누를 때만 센다 -->
    <section class="box stack">
      <div class="between wrap">
        <h2>이동·회비 근거</h2>
        <button type="button" id="btn-travel" class="btn">계산하기</button>
      </div>
      <p class="muted small">차를 가져가는 사람의 출발 동네에서 방 지역까지 길을 찾아, 운전 칸에 들어간 차의 왕복 기름값·통행료를 사람 수로 나눠요.</p>
      <div id="travel" class="stack"></div>
    </section>
  </main>
</div>

<!-- 카드를 누르면 뜨는 역할 고르기 창. 휴대폰에서는 화면 아래에 붙는다 -->
<dialog id="role-picker" class="sheet">
  <h2 id="picker-title"></h2>
  <ul id="picker-options" class="stack"></ul>
  <button type="button" id="btn-picker-close" class="btn block">닫기</button>
</dialog>
<!-- 방장만: 역할 더하기·고치기. 지우면 그 역할에 있던 사람은 미배정으로 -->
<dialog id="role-editor" class="sheet">
  <form id="role-form" class="stack">
    <h2 id="editor-title">역할 더하기</h2>
    <label>이름 <input type="text" id="role-title" required maxlength="30" placeholder="예: 설거지"></label>
    <div class="row">
      <label>정원 <input type="number" id="role-capacity" required min="1" max="8" value="1"></label>
      <label class="row"><input type="checkbox" id="role-required"> 꼭 있어야 하는 역할</label>
    </div>
    <label>할 일 <input type="text" id="role-tasks" maxlength="110" placeholder="저녁 설거지, 분리수거"></label>
    <p class="muted small">할 일은 쉼표로 나눠 5개까지. 더한 역할은 설문 점수 없이 남는 사람이 들어가요.</p>
    <p id="role-error" class="error" hidden></p>
    <div class="between">
      <button type="button" id="btn-role-delete" class="btn danger" hidden>지우기</button>
      <div class="row">
        <button type="button" id="btn-role-cancel" class="btn">닫기</button>
        <button type="submit" id="btn-role-save" class="btn primary">저장</button>
      </div>
    </div>
  </form>
</dialog>
<script th:src="@{/js/roles.js}"></script>
</body>
</html>
