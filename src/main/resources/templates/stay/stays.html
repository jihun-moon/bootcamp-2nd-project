<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('숙소')}"></head>
<body th:data-trip-id="${tripId}">
<div class="page">
  <header th:replace="~{fragments/common :: tripHeader}"></header>
  <main class="stack">
    <section class="box">
      <h2>우리 그룹이 중요하게 보는 것</h2>
      <p id="pref-empty" class="muted small">설문이 모이면 보여요.</p>
      <p id="pref-note" class="muted small" hidden></p>
      <ul id="pref-bars" class="stack"></ul>
    </section>

    <!-- 숙소마다 카드 한 장. 넓은 표는 휴대폰에서 옆으로 밀어야 해서 카드로 바꿨다. 그룹 취향 점수 높은 순 -->
    <section class="stack">
      <div class="between"><h2>숙소 후보</h2><span id="stay-count" class="muted small"></span></div>
      <p id="stay-empty" class="hint">아직 숙소가 없어요. 아래에 예약 사이트 링크를 붙여 넣어 주세요.</p>
      <ul id="stay-list" class="stay-list"></ul>
    </section>

    <form id="stay-form" class="box dashed stack">
      <h2>숙소 링크 올리기</h2>
      <p class="muted small">예약 사이트 링크를 붙여 넣으면 이름·사진·조건을 알아서 채워요. 맞는지만 보고 올리면 돼요.</p>
      <input type="url" id="stay-url" required placeholder="https://..." inputmode="url" enterkeyhint="done">
      <!-- 링크를 읽은 결과. 사진과 이름이 보이면 맞는 링크인지 바로 안다 -->
      <div id="stay-preview" class="stay-preview" hidden>
        <img id="preview-photo" alt="" referrerpolicy="no-referrer" hidden>
        <p id="preview-status" class="muted small" aria-live="polite"></p>
      </div>
      <input type="text" id="stay-title" maxlength="200" placeholder="이름 (비우면 링크 제목을 가져와요)">
      <label>1박 가격 (원, 몰라도 돼요)
        <input type="number" id="stay-price" min="0" max="100000000" step="1" inputmode="numeric" placeholder="예: 240000">
      </label>
      <fieldset>
        <legend class="muted small">이 숙소에 있는 것 (눌러서 고치기)</legend>
        <div id="stay-amenities" class="toggles"></div>
      </fieldset>
      <button type="submit" id="btn-add" class="btn primary">올리기</button>
    </form>
  </main>
</div>
<script th:src="@{/js/stays.js}"></script>
</body>
</html>
