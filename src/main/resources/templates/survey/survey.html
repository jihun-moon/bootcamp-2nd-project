<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('설문')}"></head>
<body th:data-trip-id="${tripId}">
<div class="page">
  <header th:replace="~{fragments/common :: tripHeader}"></header>
  <main class="stack">
    <div class="bar thin"><div id="progress" class="fill"></div></div>

    <!-- 질문을 한 장씩. 내용은 survey.js 의 QUESTIONS 가 채운다 -->
    <section id="step-question" class="box stack">
      <p id="q-count" class="muted small"></p>
      <h2 id="q-title"></h2>
      <p id="q-note" class="hint" hidden></p>
      <div id="q-options" class="grid2"></div>
      <button type="button" class="link btn-back">← 이전</button>
    </section>

    <!-- 마지막 장: 숙소 조건. 기본은 "상관없어"라 신경 쓰이는 것만 누르면 된다 -->
    <section id="step-preferences" class="box stack" hidden>
      <p id="p-count" class="muted small"></p>
      <h2>마지막! 숙소에서 신경 쓰이는 것만</h2>
      <p class="muted small">안 누르면 "상관없어"로 들어가요. 숙소 후보를 고를 때 그룹 점수로 쓰여요.</p>
      <ul id="preferences" class="stack"></ul>
      <p id="save-error" class="error" hidden>저장하지 못했어요. 다시 눌러 주세요.</p>
      <div class="between">
        <button type="button" class="link btn-back">← 이전</button>
        <button type="button" id="btn-save" class="btn primary">다 했어요</button>
      </div>
    </section>

    <!-- 저장 뒤 막다른 화면이 되지 않게 다음 갈 곳을 바로 보여 준다 -->
    <section id="step-saved" class="box stack" hidden>
      <h2 id="saved-title"></h2>
      <p class="muted">답은 언제든 다시 고칠 수 있어요. 방장이 추천을 다시 받으면 바뀐 답이 들어가요.</p>
      <div class="row wrap">
        <a th:href="@{/trips/{id}/roles(id=${tripId})}" class="btn primary">역할 보드 보기</a>
        <a th:href="@{/trips/{id}/stays(id=${tripId})}" class="btn">숙소 투표하기</a>
        <button type="button" id="btn-restart" class="btn plain">답 고치기</button>
      </div>
    </section>
  </main>
</div>
<script th:src="@{/js/dates.js}"></script>
<script th:src="@{/js/survey.js}"></script>
</body>
</html>
