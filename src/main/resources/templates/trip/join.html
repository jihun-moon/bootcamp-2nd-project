<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('방에 들어가기')}"></head>
<body th:data-invite-code="${inviteCode}">
<p id="message" class="page muted">방에 들어가는 중…</p>
<script>
  // POST: /api/invites/3f9a1c2b7d4e  -> { "tripId": 1 }
  // 로그인 전이면 api() 가 로그인 화면으로 보냈다가 이 주소로 돌아온다
  api('POST', '/api/invites/' + encodeURIComponent($('body').data('invite-code')))
    .done(function (res) { location.replace('/trips/' + res.tripId + '/survey'); })
    .fail(function (xhr) {
      if (xhr.status !== 401) $('#message').text('초대 링크가 맞지 않아요. 링크를 다시 받아 주세요.');
    });
</script>
</body>
</html>
