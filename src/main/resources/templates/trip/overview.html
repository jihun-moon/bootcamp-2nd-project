<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('방 개요')}"></head>
<body th:data-trip-id="${tripId}">
<div class="page">
  <header th:replace="~{fragments/common :: tripHeader}"></header>
  <main class="stack">
    <!-- 방에 들어올 때마다 "여행 가는 방"이라는 느낌이 들게 얇은 풍경 띠 하나. Unsplash 무료 사진(unsplash.com/photos/NZZgWbjYu2Y) -->
    <img class="cover thin" th:src="@{/img/photo/forest-hills.jpg}" alt="" width="1200" height="600">
    <!-- 지금 나에게 맞는 다음 할 일 하나. 처음 들어온 사람이 "여기서 뭘 하지?"를 고민하지 않게 trip.js 가 고른다 -->
    <section id="next" class="box stack">
      <h2 id="next-title"></h2>
      <p id="next-text" class="muted"></p>
      <div id="next-actions" class="row wrap"></div>
    </section>

    <!-- 날짜 맞추기: 방에 날짜가 없을 때만. 되는 날을 누르면 바로 저장되고, 겹치는 날로 좋은 후보 셋을 보인다 -->
    <section id="dates-card" class="box stack" hidden>
      <div class="between"><h2>날짜 맞추기</h2><span id="dates-count" class="muted small"></span></div>
      <p class="muted small">되는 날을 모두 눌러 주세요. 진할수록 많이 겹친 날이에요.</p>
      <div id="dates-cal"></div>
      <ul id="dates-best" class="stack"></ul>
    </section>

    <!-- 방 규칙: 운전자 기름값, 전날 불참 예약금, 술값. 트립 개요에서 모두가 보고 방장만 바꾼다 -->
    <section class="box stack">
      <h2>방 규칙</h2>
      <p id="rules-note" class="muted small"></p>
      <ul id="rules" class="stack"></ul>
    </section>

    <section class="box stack">
      <h2>초대 링크</h2>
      <div class="row">
        <input type="text" id="invite-link" readonly aria-label="초대 링크">
        <button type="button" id="btn-invite" class="btn">보내기</button>
      </div>
    </section>

    <section class="box stack">
      <div class="between small"><span class="strong">설문 진행</span><span id="survey-count" class="muted"></span></div>
      <div class="bar"><div id="survey-bar" class="fill"></div></div>
      <ul id="members" class="grid4"></ul>
    </section>
  </main>
</div>
<script th:src="@{/js/dates.js}"></script>
<script th:src="@{/js/trip.js}"></script>
</body>
</html>
