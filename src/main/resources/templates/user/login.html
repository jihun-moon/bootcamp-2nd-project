<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('로그인')}"></head>
<body>
<header th:replace="~{fragments/common :: siteHeader(false)}"></header>
<main class="page narrow stack loose">
  <div class="stack">
    <h1>로그인하고 시작해요</h1>
    <p class="muted">카카오 계정으로 한 번이면 돼요. 비밀번호는 TripMate 가 저장하지 않고, 이름과 프로필 사진만 받아요.</p>
  </div>
  <p th:if="${param.error}" class="notice">카카오 로그인에 실패했어요. 다시 시도해 주세요.</p>
  <p id="login-error" class="notice" hidden></p>

  <!-- 카카오 콘솔 [도구 > 디자인 리소스 다운로드 > 카카오 로그인]에서 받은 공식 완성형 그림(kakao_login_kr_large.svg) 그대로.
       심볼·글자 비율을 바꾸지 않고, 넓힐 때는 가이드대로 노란 바탕만 좌우로 똑같이 늘린다 -->
  <a id="btn-kakao" href="/oauth2/authorization/kakao" class="kakao-login" hidden>
    <img th:src="@{/img/kakao_login_kr_large.svg}" alt="카카오 로그인" width="336" height="46">
  </a>
  <!-- 사용자에게는 까닭(키 설정)을 보이지 않는다. 개발자는 서버 로그와 README 로 안다 -->
  <p id="kakao-off" class="hint" hidden>지금은 로그인을 쓸 수 없어요. 잠시 뒤 다시 와 주세요.</p>
  <p class="muted small center">로그인 전에 둘러보고 싶다면 <a th:href="@{/demo}" class="link">체험 방</a>을 눌러 보세요.</p>
</main>
<script th:src="@{/js/login.js}"></script>
</body>
</html>
