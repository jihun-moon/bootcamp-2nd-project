<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('로그인')}"></head>
<body>
<header th:replace="~{fragments/common :: siteHeader}"></header>
<main class="page narrow stack loose">
  <div class="stack">
    <h1>로그인하고 시작해요</h1>
    <p class="muted">카카오 계정으로 한 번이면 돼요. 비밀번호는 TripMate 가 저장하지 않고, 이름과 프로필 사진만 받아요.</p>
  </div>
  <p th:if="${param.error}" class="notice">카카오 로그인에 실패했어요. 다시 시도해 주세요.</p>
  <p id="login-error" class="notice" hidden></p>

  <!-- 문구는 카카오 로그인 디자인 가이드의 완성형("카카오 로그인"). "카카오로 시작하기"는 카카오싱크 전용이다 -->
  <a id="btn-kakao" href="/oauth2/authorization/kakao" class="btn kakao big block" hidden>카카오 로그인</a>
  <!-- 사용자에게는 까닭(키 설정)을 보이지 않는다. 개발자는 서버 로그와 README 로 안다 -->
  <p id="kakao-off" class="hint" hidden>지금은 로그인을 쓸 수 없어요. 잠시 뒤 다시 와 주세요.</p>

  <section id="dev-login" class="box dashed stack" hidden>
    <h2>개발용 로그인</h2>
    <p class="muted small">예시 방 참여자로 들어가요. 배포에서는 꺼져 있어요.</p>
    <div id="demo-names" class="grid4"></div>
    <form id="dev-form" class="row">
      <input type="text" id="dev-name" required maxlength="20" placeholder="새 이름으로">
      <button type="submit" class="btn">들어가기</button>
    </form>
  </section>
</main>
<script th:src="@{/js/login.js}"></script>
</body>
</html>
